<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 
    Hermes Monitor — ikona czarno-biała v1.2.0
    Monochromatyczny kaduceusz Hermesa: skrzydlaty kij ze splecionymi wężami.
    Kolor: currentColor (dziedziczony z kontekstu — biały na ciemnym tle, czarny na jasnym).
    Przezroczyste tło — współgra z dowolnym kolorem tła (jasny/ciemny motyw).
  -->
  
  <!-- Tło: subtelny ciemny prostokąt, tylko jeśli potrzeba kontrastu; przezroczysty domyślnie -->
  <!-- <rect x="2" y="2" width="96" height="96" rx="24" fill="#0B1121" opacity="0.9"/> -->
  
  <!-- Skrzydła (u góry) — prosty geometryczny kształt -->
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lewe skrzydło -->
    <path d="M44 32 Q36 18 26 14"/>
    <path d="M44 32 Q38 20 30 16"/>
    <path d="M44 32 Q40 22 34 18"/>
    <!-- Prawe skrzydło -->
    <path d="M56 32 Q64 18 74 14"/>
    <path d="M56 32 Q62 20 70 16"/>
    <path d="M56 32 Q60 22 66 18"/>
  </g>
  
  <!-- Centralny kij (laska) -->
  <line x1="50" y1="28" x2="50" y2="82" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Kula na szczycie laski -->
  <circle cx="50" cy="26" r="4" fill="currentColor" opacity="0.9"/>
  
  <!-- Węże splecione wokół laski — dwie symetryczne krzywe -->
  <g stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lewy wąż (w dół) -->
    <path d="M46 36 Q36 45 46 54 Q54 60 46 68 Q38 74 44 82" opacity="0.85"/>
    <!-- Prawy wąż (w dół) — lustrzane odbicie -->
    <path d="M54 36 Q64 45 54 54 Q46 60 54 68 Q62 74 56 82" opacity="0.85"/>
  </g>
  
  <!-- Głowy węży (małe trójkąty) -->
  <polygon points="42,80 38,86 46,82" fill="currentColor" opacity="0.8"/>
  <polygon points="58,80 62,86 54,82" fill="currentColor" opacity="0.8"/>
  
  <!-- Subtelne oznaczenie "monitora" — małe okręgi jak punkty danych przy podstawie -->
  <circle cx="38" cy="90" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="46" cy="90" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="54" cy="90" r="1.5" fill="currentColor" opacity="0.7"/>
  <circle cx="62" cy="90" r="1.5" fill="currentColor" opacity="0.5"/>
</svg>
