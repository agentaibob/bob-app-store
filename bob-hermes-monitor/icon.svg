<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hermes Monitor — ikona wzorowana na kwadratowym kaduceuszu Hermes Agent
       + jeden element monitoringu: puls EKG w dolnej części. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6db5"/>
      <stop offset="100%" stop-color="#14345c"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f2ff"/>
      <stop offset="100%" stop-color="#a8c8ee"/>
    </linearGradient>
  </defs>

  <!-- Ramka kwadratowa z zaokrąglonymi rogami (jak załączona ikona Hermes) -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#frame)"/>

  <!-- Kaduceusz Hermesa: skrzydła u góry -->
  <g stroke="url(#rod)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- lewe skrzydło -->
    <path d="M225 168 Q182 110 128 96"/>
    <path d="M225 168 Q193 122 145 112"/>
    <path d="M225 168 Q204 133 162 128"/>
    <!-- prawe skrzydło -->
    <path d="M287 168 Q330 110 384 96"/>
    <path d="M287 168 Q319 122 367 112"/>
    <path d="M287 168 Q308 133 350 128"/>
  </g>

  <!-- Centralny kij (laska) -->
  <line x1="256" y1="150" x2="256" y2="356" stroke="url(#rod)" stroke-width="30" stroke-linecap="round"/>

  <!-- Kula na szczycie laski -->
  <circle cx="256" cy="132" r="34" fill="url(#rod)"/>

  <!-- Węże splecione wokół laski -->
  <g stroke="url(#rod)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M226 196 C176 230 336 268 226 308 C196 322 316 348 226 370"/>
    <path d="M286 196 C336 230 176 268 286 308 C316 322 196 348 286 370"/>
  </g>

  <!-- Element monitoringu: puls EKG w dolnej części ikony -->
  <polyline points="132,428 208,428 236,392 264,464 294,428 380,428"
            fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>