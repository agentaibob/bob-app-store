version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bob-hermes-monitor_server_1
      APP_PORT: 8126

  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Hermes Agent data on umbrelOS. On the HOST the hermes home is:
      # /home/umbrel/umbrel/app-data/hermes-agent/data/hermes
      # (NOT /opt/data, which exists only inside the hermes-agent container —
      #  mounting that made the app read an empty dir -> 0 profiles).
      # :ro = read-only safety invariant (server must never modify hermes data).
      - /home/umbrel/umbrel/app-data/hermes-agent/data/hermes:/hermes-data:ro
    command:
      - /bin/sh
      - -c
      - |
        python3 -c "
        import urllib.request, os
        url = 'https://raw.githubusercontent.com/agentaibob/bob-app-store/main/bob-hermes-monitor/hermes_server.py'
        dest = '/app/hermes_server.py'
        os.makedirs('/app', exist_ok=True)
        with urllib.request.urlopen(url) as r:
            with open(dest, 'wb') as f:
                f.write(r.read())
        print('[hermes-monitor] Downloaded server code from GitHub')
        " && exec python3 /app/hermes_server.py
