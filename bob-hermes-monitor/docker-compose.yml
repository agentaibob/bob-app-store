version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bob-hermes-monitor_server_1
      APP_PORT: 8126

  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /home/umbrel/umbrel/app-data/hermes-agent/data/hermes:/hermes-data:ro
    command:
      - /bin/sh
      - -c
      - |
        python3 -c "import base64,gzip,os;os.makedirs('/app',exist_ok=True);open('/app/hermes_server.py','wb').write(gzip.decompress(base64.b64decode('')))" && exec python3 /app/hermes_server.py
