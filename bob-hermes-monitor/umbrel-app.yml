manifestVersion: 1
id: bob-hermes-monitor
name: Hermes Monitor
tagline: Live status, tokens and cron health for Hermes Agent
icon: https://raw.githubusercontent.com/agentaibob/bob-app-store/main/bob-hermes-monitor/icon.svg
category: Utilities
version: "1.8.0"
port: 8126
description: >-
  Dashboard i widget dla Hermes Agent: status gateway i profili, tokeny i
  koszty, zadania cron, tablica kanban, zdrowie kluczy API i logi.
  Czyta dane Hermesa z katalogu danych wyłącznie w trybie read-only. Klucze API
  pokazywane tylko po nazwach zmiennych, nigdy po wartościach.
developer: Bob
website: https://github.com/agentaibob/bob-app-store
submitter: Tomek
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "hermes"
    type: "three-stats"
    refresh: "5s"
    endpoint: "server:8126/widgets/hermes"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "user"
          text: "7/7"
          subtext: "Profile online"
        - icon: "coin"
          text: "11.0M"
          subtext: "Tokeny łącznie"
        - icon: "currency-dollar"
          text: "3.91"
          subtext: "Koszty łącznie (est.)"