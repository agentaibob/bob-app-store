version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bob-network-monitor_server_1
      APP_PORT: 8124

  collector:
    image: python:3.12-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -c
      - |
        cat > /data/collector.py << 'PYEOF'
        import json, time, os, re, socket, threading
        OUT = '/data/netstats.json'
        APP_OUT = '/data/appstats.json'
        STATE = '/data/collector_state.json'
        DIAG_OUT = '/data/diag.json'
        DOCKER = '/var/run/docker.sock'
        # --- Historia próbek (wykres) ---
        HIST_PATH = '/data/history.json'
        HIST_MAX = 7200          # max ~2h w 1s interwałach
        HIST_FLUSH = 15          # zapis do pliku co N sekund
        history = []             # [ [unixtime, rx_rate, tx_rate], ... ]
        last_flush = 0.0
        def _load_history():
            global history
            try:
                if os.path.exists(HIST_PATH):
                    with open(HIST_PATH) as f:
                        h = json.load(f)
                    if isinstance(h, list) and h and isinstance(h[0], list) and len(h[0]) == 3:
                        history = h[-HIST_MAX:]
            except Exception:
                pass
        _load_history()
        
        def docker_get(path):
            try:
                s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                s.settimeout(3)
                s.connect(DOCKER)
                s.sendall(('GET %s HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' % path).encode())
                data = b''
                while True:
                    chunk = s.recv(65536)
                    if not chunk:
                        break
                    data += chunk
                s.close()
                if b'\r\n\r\n' not in data:
                    return None
                headers, body = data.split(b'\r\n\r\n', 1)
                if b'transfer-encoding: chunked' in headers.lower():
                    out = b''
                    while body:
                        nl = body.find(b'\r\n')
                        if nl < 0:
                            break
                        try:
                            size = int(body[:nl].split(b';')[0], 16)
                        except Exception:
                            break
                        body = body[nl + 2:]
                        if size == 0:
                            break
                        out += body[:size]
                        body = body[size + 2:]
                    body = out
                return json.loads(body.decode('utf-8', errors='replace'))
            except Exception:
                return None
        
        def main_iface():
            try:
                with open('/proc/net/route') as f:
                    for line in f.readlines()[1:]:
                        p = line.split()
                        if len(p) > 3 and p[1] == '00000000' and p[3] != '00000000':
                            return p[0]
            except Exception:
                pass
            return None
        
        def iface_bytes_from_file(path, iface):
            try:
                with open(path) as f:
                    for line in f.readlines()[2:]:
                        if ':' not in line:
                            continue
                        name, data = line.split(':', 1)
                        if name.strip() == iface:
                            p = data.split()
                            return int(p[0]), int(p[8])
            except Exception:
                pass
            return None
        
        def host_veth_ifindex_map():
            res = {}
            try:
                for name in os.listdir('/sys/class/net'):
                    if not name.startswith('veth'):
                        continue
                    try:
                        with open('/sys/class/net/%s/ifindex' % name) as f:
                            res[int(f.read().strip())] = name
                    except Exception:
                        continue
            except Exception:
                pass
            return res
        
        def container_eth0_iflink(pid):
            try:
                with open('/proc/%s/root/sys/class/net/eth0/iflink' % pid) as f:
                    return int(f.read().strip())
            except Exception:
                return None
        
        def container_eth0_bytes(pid):
            return iface_bytes_from_file('/proc/%s/net/dev' % pid, 'eth0')
        
        def nice_app_name(c):
            labels = c.get('Labels') or {}
            project = labels.get('com.docker.compose.project') or ''
            if project:
                return project.replace('-', ' ').replace('_', ' ').strip().title()
            names = c.get('Names') or []
            raw = names[0] if names else (c.get('Id', '')[:12])
            raw = str(raw).lstrip('/')
            n = re.sub(r'_\d+$', '', raw)
            n = n.replace('-', ' ').replace('_', ' ')
            return n.strip().title() or raw
        
        def container_pid(cid):
            info = docker_get('/containers/%s/json' % cid)
            if not info:
                return 0
            try:
                return int((info.get('State') or {}).get('Pid') or 0)
            except Exception:
                return 0
        
        def _parse_tcp_peers(path, v6=False):
            peers = set()
            try:
                with open(path) as f:
                    for line in f.readlines()[1:]:
                        parts = line.split()
                        if len(parts) < 4:
                            continue
                        st = parts[3]
                        if st != '01':
                            continue
                        rem = parts[2]
                        if ':' not in rem:
                            continue
                        hx, hxp = rem.rsplit(':', 1)
                        try:
                            port = int(hxp, 16)
                        except Exception:
                            continue
                        if port == 0:
                            continue
                        if v6:
                            if len(hx) != 32:
                                continue
                            words32 = [hx[i:i+8] for i in range(0, 32, 8)]
                            try:
                                swapped = ''.join(bytes.fromhex(w)[::-1].hex() for w in words32)
                                ip = socket.inet_ntop(socket.AF_INET6, bytes.fromhex(swapped))
                            except Exception:
                                continue
                            m4 = re.match(r'^::ffff:(\d+\.\d+\.\d+\.\d+)$', ip)
                            if m4:
                                ip = m4.group(1)
                        else:
                            if len(hx) != 8:
                                continue
                            ip = '.'.join(str(int(hx[i:i+2], 16)) for i in (6, 4, 2, 0))
                        if ip.startswith('0.') or ip == '0.0.0.0':
                            continue
                        peers.add('%s:%d' % (ip, port))
            except Exception:
                pass
            return peers
        
        def container_peers(pid):
            peers = set()
            if not pid:
                return peers
            peers |= _parse_tcp_peers('/proc/%s/net/tcp' % pid)
            peers |= _parse_tcp_peers('/proc/%s/net/tcp6' % pid, v6=True)
            return peers
        
        dns_cache = {}
        DNS_TTL = 3600
        
        def _is_private(ip):
            if ip.startswith('10.') or ip.startswith('127.') or ip.startswith('192.168.'):
                return True
            if ip.startswith('172.'):
                try:
                    return 16 <= int(ip.split('.')[1]) <= 31
                except Exception:
                    return True
            if ip.startswith('169.254.'):
                return True
            if ':' in ip:
                return True
            return False
        
        def lookup_peer(ip):
            now = time.time()
            hit = dns_cache.get(ip)
            if hit is not None and now - hit[1] < DNS_TTL:
                return hit[0]
            name = None
            if not _is_private(ip):
                try:
                    name = socket.gethostbyaddr(ip)[0]
                except Exception:
                    name = None
            dns_cache[ip] = (name, now)
            return name
        
        def dns_worker():
            while True:
                try:
                    ips = set()
                    for v in list(peers_map.values()):
                        for p in v:
                            ip = p.rpartition(':')[0]
                            if ip not in dns_cache:
                                ips.add(ip)
                    for ip in sorted(ips)[:8]:
                        lookup_peer(ip)
                except Exception:
                    pass
                time.sleep(10)
        
        def fmt_peer(p):
            ip, _, port = p.rpartition(':')
            name = lookup_peer(ip)
            return {'ip': ip, 'port': port, 'host': name}
        
        baseline, app_baseline = {}, {}
        if os.path.exists(STATE):
            try:
                with open(STATE) as f:
                    s = json.load(f)
                baseline = s.get('baseline', {}) or {}
                app_baseline = s.get('apps', {}) or {}
            except Exception:
                pass
        prev = {}
        MAP_TTL = 12
        name_map = {}
        peers_map = {}
        name_map_ts = 0.0
        last_diag = {}
        
        def refresh_name_map():
            global name_map, name_map_ts, last_diag, peers_map
            now = time.time()
            if now - name_map_ts < MAP_TTL and name_map:
                return
            try:
                veth_idx = host_veth_ifindex_map()
                host_veth_bytes = {}
                with open('/proc/net/dev') as f:
                    for line in f.readlines()[2:]:
                        if ':' not in line:
                            continue
                        nm, data = line.split(':', 1)
                        nm = nm.strip()
                        if nm.startswith('veth'):
                            p = data.split()
                            host_veth_bytes[nm] = (int(p[0]), int(p[8]))
                containers = docker_get('/containers/json')
                mapping = {}
                peers = {}
                used = set()
                if isinstance(containers, list):
                    for c in containers:
                        cid = c.get('Id') or ''
                        app = nice_app_name(c)
                        pid = container_pid(cid)
                        if not pid:
                            continue
                        iflink = container_eth0_iflink(pid)
                        eth = container_eth0_bytes(pid)
                        vn = None
                        if iflink and iflink in veth_idx:
                            vn = veth_idx[iflink]
                        if vn is None and eth:
                            for vname, (vr, vt) in host_veth_bytes.items():
                                if vname in used:
                                    continue
                                if vt == eth[0] and vr == eth[1]:
                                    vn = vname
                                    break
                        if vn and vn not in used:
                            mapping[vn] = app
                            used.add(vn)
                            for peer in container_peers(pid):
                                peers.setdefault(app, set()).add(peer)
                for vname in host_veth_bytes:
                    if vname not in mapping:
                        mapping[vname] = vname
                name_map = mapping
                peers_map = {k: sorted(v) for k, v in peers.items()}
                last_diag = {
                    'docker_sock': os.path.exists(DOCKER),
                    'docker_ok': bool(containers),
                    'containers': len(containers) if isinstance(containers, list) else 0,
                    'mapped': len(used),
                    'unmapped_veth': sum(1 for v in host_veth_bytes if v not in mapping or mapping[v] == v),
                    'method': 'iflink+counters',
                    'error': ''
                }
            except Exception as e:
                last_diag = {'docker_sock': os.path.exists(DOCKER), 'docker_ok': False,
                             'containers': 0, 'mapped': 0, 'unmapped_veth': 0,
                             'method': 'fallback', 'error': str(e)}
            name_map_ts = now
        
        refresh_name_map()
        threading.Thread(target=dns_worker, daemon=True).start()
        
        while True:
            now = time.time()
            iface = main_iface()
            st = iface_bytes_from_file('/proc/net/dev', iface) if iface else None
            rx_total = tx_total = rx_rate = tx_rate = 0.0
            if st:
                rx, tx = st
                if iface not in baseline:
                    baseline[iface] = {'rx': rx, 'tx': tx}
                rx_total = max(0, rx - baseline[iface]['rx'])
                tx_total = max(0, tx - baseline[iface]['tx'])
                if iface in prev:
                    dt = now - prev[iface][0]
                    if dt > 0:
                        rx_rate = max(0.0, (rx - prev[iface][1]) / dt)
                        tx_rate = max(0.0, (tx - prev[iface][2]) / dt)
                prev[iface] = (now, rx, tx)
            try:
                with open(OUT, 'w') as f:
                    json.dump({'rx_total': rx_total, 'tx_total': tx_total, 'rx_rate': rx_rate, 'tx_rate': tx_rate, 'iface': iface}, f)
            except Exception:
                pass

            # Historia próbek dla wykresu
            try:
                history.append([now, rx_rate, tx_rate])
                if len(history) > HIST_MAX:
                    del history[:len(history) - HIST_MAX]
                if now - last_flush >= HIST_FLUSH:
                    last_flush = now
                    with open(HIST_PATH, 'w') as f:
                        json.dump(history, f)
            except Exception:
                pass
        
            refresh_name_map()
        
            app_rows = []
            try:
                with open('/proc/net/dev') as f:
                    veth_lines = []
                    for line in f.readlines()[2:]:
                        if ':' not in line:
                            continue
                        nm, data = line.split(':', 1)
                        nm = nm.strip()
                        if nm.startswith('veth'):
                            p = data.split()
                            if len(p) >= 9:
                                veth_lines.append((nm, int(p[0]), int(p[8])))
                agg = {}
                for vn, vr, vt in veth_lines:
                    name = name_map.get(vn, vn)
                    if name not in agg:
                        agg[name] = {'rx': 0, 'tx': 0}
                    agg[name]['rx'] += vt
                    agg[name]['tx'] += vr
                for name, vals in sorted(agg.items()):
                    rx, tx = vals['rx'], vals['tx']
                    if name not in app_baseline:
                        app_baseline[name] = {'rx': rx, 'tx': tx}
                    arx = max(0, rx - app_baseline[name]['rx'])
                    atx = max(0, tx - app_baseline[name]['tx'])
                    arxr = atxr = 0.0
                    if name in prev:
                        dt = now - prev[name][0]
                        if dt > 0:
                            arxr = max(0.0, (rx - prev[name][1]) / dt)
                            atxr = max(0.0, (tx - prev[name][2]) / dt)
                    prev[name] = (now, rx, tx)
                    peers = [fmt_peer(p) for p in (peers_map.get(name, []) or [])]
                    app_rows.append({'name': name, 'rx_total': arx, 'tx_total': atx, 'rx_rate': arxr, 'tx_rate': atxr, 'peers': peers})
            except Exception as e:
                last_diag['error'] = 'veth_loop:' + str(e)
        
            sa_rx = sum(x['rx_total'] for x in app_rows)
            sa_tx = sum(x['tx_total'] for x in app_rows)
            sys_row = {
                'name': 'Pozosta\u0142e',
                'rx_total': max(0, rx_total - sa_rx),
                'tx_total': max(0, tx_total - sa_tx),
                'rx_rate': max(0.0, rx_rate - sum(x['rx_rate'] for x in app_rows)),
                'tx_rate': max(0.0, tx_rate - sum(x['tx_rate'] for x in app_rows))
            }
            try:
                with open(APP_OUT, 'w') as f:
                    json.dump({'apps': app_rows, 'system': sys_row, 'ts': now, 'diag': last_diag}, f)
            except Exception:
                pass
            try:
                with open(DIAG_OUT, 'w') as f:
                    json.dump(last_diag, f)
            except Exception:
                pass
            try:
                with open(STATE, 'w') as f:
                    json.dump({'baseline': baseline, 'apps': app_baseline}, f)
            except Exception:
                pass
            time.sleep(1)
        
        PYEOF
        exec python3 /data/collector.py


  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -c
      - |
        python3 -c "import base64,gzip,os;os.makedirs('/app',exist_ok=True);open('/app/hermes_server.py','wb').write(gzip.decompress(base64.b64decode('')));print('[netmon] server code deployed')" && exec python3 /app/hermes_server.py
