version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bob-raspberry-monitor_server_1
      APP_PORT: 8127

  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -c
      - |
        apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq openssh-client sshpass >/dev/null 2>&1
        python3 -c "import base64,gzip,os;os.makedirs('/app',exist_ok=True);open('/app/hermes_server.py','wb').write(gzip.decompress(base64.b64decode('')));print('[raspberry-monitor] server code deployed')" && exec python3 /app/hermes_server.py
