version: "3.7"

services:
  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    ports:
      - "8127:8127"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -c
      - |
        apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq openssh-client sshpass curl >/dev/null 2>&1
        python3 -c "import base64,gzip,os;os.makedirs('/app',exist_ok=True);open('/app/hermes_server.py','wb').write(gzip.decompress(base64.b64decode('')));print('[raspberry-monitor] server code deployed')" && ( [ -s /data/echarts.min.js ] || curl -sL --max-time 90 -o /data/echarts.min.js https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js || true ) && exec python3 /app/hermes_server.py
