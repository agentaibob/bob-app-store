version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bob-garmin-monitor_server_1
      APP_PORT: 8125

  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 30s
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/.deps_ok ]; then
          pip install --no-cache-dir --quiet garminconnect curl_cffi && touch /data/.deps_ok
        fi
        cat > /data/garmin_server.py << 'PYEOF'
        #!/usr/bin/env python3
        """Garmin Monitor — web UI + widget dla UmbrelOS.

        Serwer HTTP (stdlib) + garminconnect. Dane Garmin w cache /data/garmin_data.json,
        tokeny w /data/.garminconnect. Login przez formularz WWW (email+hasło+MFA).
        Endpoints: / (dashboard), /login (POST), /api/summary, /api/status, /widgets/garmin.
        """
        import base64
        import datetime
        import json
        import os
        import threading
        import time
        import urllib.parse
        from http.server import BaseHTTPRequestHandler, HTTPServer

        DATA_DIR = os.environ.get("GARMIN_DATA_DIR", "/data")
        TOKEN_DIR = os.environ.get("GARMIN_TOKEN_DIR", os.path.join(DATA_DIR, ".garminconnect"))
        DATA_JSON = os.path.join(DATA_DIR, "garmin_data.json")
        UI_FILE = os.path.join(DATA_DIR, "garmin_ui.html")
        PORT = int(os.environ.get("GARMIN_PORT", "8125"))
        VERSION = "1.0.5"
        REFRESH_S = 900  # odświeżanie danych co 15 min

        BIKE_TYPES = ("cycling", "road_biking")
        MONTHS_PL = ["styczeń", "luty", "marzec", "kwiecień", "maj", "czerwiec",
                     "lipiec", "sierpień", "wrzesień", "październik", "listopad", "grudzień"]

        HTML_B64 = ""
        _html_cache = None


        def get_html():
            global _html_cache
            if _html_cache is not None:
                return _html_cache
            try:
                if os.path.exists(UI_FILE):
                    with open(UI_FILE, encoding="utf-8") as f:
                        _html_cache = f.read()
                        return _html_cache
            except Exception:
                pass
            if HTML_B64:
                _html_cache = base64.b64decode(HTML_B64).decode("utf-8")
            else:
                _html_cache = "<h1>UI missing</h1>"
            return _html_cache


        def pl_num(x, decimals=1):
            try:
                return f"{float(x):,.{decimals}f}".replace(",", " ").replace(".", ",")
            except (TypeError, ValueError):
                return "?"


        def fmt_dur(seconds):
            seconds = int(seconds or 0)
            h, rem = divmod(seconds, 3600)
            m = rem // 60
            if h:
                return f"{h} h {m:02d} min"
            return f"{m} min"


        # ---------- Garmin ----------

        def logged_in():
            return os.path.exists(os.path.join(TOKEN_DIR, "garmin_tokens.json"))


        def clear_tokens():
            try:
                from garminconnect import Garmin
                Garmin("", "").logout(TOKEN_DIR)
            except Exception:
                try:
                    os.remove(os.path.join(TOKEN_DIR, "garmin_tokens.json"))
                except Exception:
                    pass


        def get_activities_from(c, year):
            acts = []
            start = 0
            while start < 5000:
                batch = c.get_activities(start, 100)
                if not batch:
                    break
                acts.extend(batch)
                oldest = str(batch[-1].get("startTimeLocal", ""))[:4]
                if oldest and oldest.isdigit() and int(oldest) < year:
                    break
                if len(batch) < 100:
                    break
                start += len(batch)
            return acts


        def get_body_battery_now(c, date_iso):
            try:
                bb = c.get_body_battery(date_iso)
            except Exception:
                return None
            if not bb:
                return None
            item = bb[0] if isinstance(bb, list) else bb
            if not isinstance(item, dict):
                return None
            values = item.get("bodyBatteryValues") or item.get("bodyBatteryValuesArray") or []
            for v in reversed(values):
                if isinstance(v, dict):
                    for k in ("value", "bodyBatteryLevel"):
                        if v.get(k) is not None:
                            return v[k]
                if isinstance(v, list) and len(v) >= 2 and v[1] is not None:
                    return v[1]
                if isinstance(v, (int, float)):
                    return v
            return None


        def get_sleep_summary(c, date_iso):
            try:
                data = c.get_sleep_data(date_iso) or {}
            except Exception:
                return None
            dto = data.get("dailySleepDTO") or {}
            total = dto.get("sleepTimeSeconds")
            if not total:
                levels = data.get("sleepLevels") or {}
                raw = levels.get("levels") if isinstance(levels, dict) else levels
                if raw:
                    total = sum((e.get("seconds") or 0) for e in raw if e.get("activityLevel") != "awake")
                else:
                    return None
            deep = rem = light = 0
            try:
                levels = data.get("sleepLevels") or {}
                raw = levels.get("levels") if isinstance(levels, dict) else levels
                for e in raw or []:
                    secs = e.get("seconds") or 0
                    lvl = e.get("activityLevel", "")
                    if lvl == "deep":
                        deep += secs
                    elif lvl == "rem":
                        rem += secs
                    elif lvl == "light":
                        light += secs
            except Exception:
                pass
            return (int(total), int(deep), int(rem), int(light))


        def fetch_data():
            from garminconnect import Garmin
            c = Garmin("", "")
            c.login(TOKEN_DIR)
            today = datetime.date.today()
            data_day = today - datetime.timedelta(days=1)  # raport = dane z poprzedniego dnia
            out = {"year": today.year, "month_now": today.month,
                   "today": today.isoformat(), "data_day": data_day.isoformat()}

            try:
                st = c.get_stats(data_day.isoformat()) or {}
            except Exception:
                st = {}
            out["steps"] = st.get("totalSteps")
            out["step_goal"] = st.get("dailyStepGoal")
            out["dist_km"] = (st.get("totalDistanceMeters") or 0) / 1000
            out["kcal"] = st.get("activeKilocalories")
            if out["steps"] and out["step_goal"]:
                out["steps_pct"] = round(out["steps"] / out["step_goal"] * 100)
            wd = st.get("wellnessDistanceMeters")
            out["steps_km"] = (wd or 0) / 1000 if wd else ((out["steps"] or 0) * 0.762)

            km_by_day = {}
            try:
                for a in get_activities_from(c, today.year):
                    ts = str(a.get("startTimeLocal", ""))
                    if not ts.startswith(str(today.year)):
                        continue
                    if ts[:10] > data_day.isoformat():
                        continue
                    if (a.get("activityType") or {}).get("typeKey") not in BIKE_TYPES:
                        continue
                    km_by_day[ts[:10]] = km_by_day.get(ts[:10], 0) + a.get("distance", 0) / 1000
            except Exception:
                pass
            out["day_km"] = km_by_day.get(data_day.isoformat(), 0)
            months = {}
            for d, k in km_by_day.items():
                m = int(d[5:7])
                months[m] = months.get(m, 0) + k
            out["months"] = {m: round(months.get(m, 0), 1) for m in range(1, today.month + 1) if months.get(m)}
            out["year_km"] = round(sum(months.values()), 1)

            try:
                hr = c.get_heart_rates(data_day.isoformat()) or {}
                out["rhr"] = hr.get("restingHeartRate")
                out["rhr7"] = hr.get("lastSevenDaysAvgRestingHeartRate")
            except Exception:
                pass
            out["bb"] = get_body_battery_now(c, data_day.isoformat())
            try:
                s = c.get_stress_data(data_day.isoformat()) or {}
                out["stress"] = s.get("avgStressLevel")
            except Exception:
                pass
            try:
                sl = get_sleep_summary(c, data_day.isoformat())
                if sl:
                    total, deep, rem, light = sl
                    parts = [fmt_dur(total)]
                    if deep:
                        parts.append("głęboki " + fmt_dur(deep))
                    if rem:
                        parts.append("REM " + fmt_dur(rem))
                    if light:
                        parts.append("lekki " + fmt_dur(light))
                    out["sleep"] = " · ".join(parts)
            except Exception:
                pass
            try:
                h = c.get_hrv_data((data_day - datetime.timedelta(days=1)).isoformat()) or {}
                if h:
                    out["hrv"] = h.get("lastNightAvg") or h.get("lastNightAvg5MinHigh")
            except Exception:
                pass

            out["updated"] = datetime.datetime.now().strftime("%d.%m %H:%M")
            out["error"] = None
            return out


        # ---------- cache ----------

        _lock = threading.Lock()
        _fetch_lock = threading.Lock()


        def load_data():
            try:
                with open(DATA_JSON) as f:
                    return json.load(f)
            except Exception:
                return {}


        def save_data(d):
            with _lock:
                try:
                    tmp = DATA_JSON + ".tmp"
                    with open(tmp, "w") as f:
                        json.dump(d, f)
                    os.replace(tmp, DATA_JSON)
                except Exception:
                    pass


        def refresh_once():
            if not logged_in():
                return None
            with _fetch_lock:
                try:
                    d = fetch_data()
                    d["logged_in"] = True
                    save_data(d)
                    return d
                except Exception as e:
                    err = str(e)
                    d = load_data()
                    d["logged_in"] = True
                    d["error"] = ("Wymagane ponowne logowanie (token wygasł)" if any(
                        k in err.lower() for k in ("token", "login", "401", "403")) else err[:150])
                    save_data(d)
                    return d


        def refresh_loop():
            time.sleep(2)
            while True:
                if logged_in():
                    refresh_once()
                time.sleep(REFRESH_S)


        def do_login(email, password, mfa, force=False):
            if force:
                clear_tokens()
            from garminconnect import Garmin
            c = Garmin(email, password, prompt_mfa=lambda: (mfa or "").strip())
            c.login(TOKEN_DIR)
            try:
                with open(os.path.join(DATA_DIR, "garmin_user.txt"), "w") as f:
                    f.write(email)
            except Exception:
                pass
            d = fetch_data()
            d["logged_in"] = True
            save_data(d)


        def get_user():
            try:
                with open(os.path.join(DATA_DIR, "garmin_user.txt")) as f:
                    return f.read().strip()
            except Exception:
                return ""


        # ---------- HTTP ----------

        class H(BaseHTTPRequestHandler):
            def _json(self, obj, code=200):
                body = json.dumps(obj).encode()
                self.send_response(code)
                self.send_header("Content-Type", "application/json; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def _html(self, body, code=200):
                body = body.encode("utf-8")
                self.send_response(code)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def _redirect(self, loc):
                self.send_response(302)
                self.send_header("Location", loc)
                self.send_header("Content-Length", "0")
                self.end_headers()

            def summary(self):
                d = load_data()
                if not logged_in():
                    return {"logged_in": False, "version": VERSION, "error": ""}
                d["logged_in"] = True
                d["user"] = get_user()
                d["version"] = VERSION
                d["year"] = d.get("year") or datetime.date.today().year
                return d

            def widget_items(self):
                d = load_data()
                if not logged_in():
                    return [
                        {"title": "Wczoraj", "text": "—", "subtext": "km"},
                        {"title": "Rok", "text": "—", "subtext": "km"},
                        {"title": "Kroki", "text": "—", "subtext": "cel"},
                        {"title": "Body Batt.", "text": "—", "subtext": "/100"},
                    ]
                year = d.get("year") or datetime.date.today().year
                return [
                    {"title": "Wczoraj", "text": pl_num(d.get("day_km", 0)), "subtext": "km"},
                    {"title": "Rok " + str(year), "text": pl_num(d.get("year_km", 0), 0), "subtext": "km"},
                    {"title": "Kroki", "text": (str(d["steps_pct"]) + "%" if d.get("steps_pct") is not None else "—"),
                     "subtext": (pl_num(d.get("steps", 0), 0) + " / " + pl_num(d.get("step_goal", 0), 0)
                                 if d.get("steps") else "")},
                    {"title": "Body Batt.", "text": (str(d["bb"]) if d.get("bb") is not None else "—"), "subtext": "/100"},
                ]

            def do_GET(self):
                path = urllib.parse.urlsplit(self.path).path
                if path == "/widgets/garmin":
                    self._json({"type": "four-stats", "refresh": "5s", "link": "", "items": self.widget_items()})
                elif path == "/api/summary":
                    self._json(self.summary())
                elif path == "/api/status":
                    d = load_data()
                    self._json({"logged_in": logged_in(), "version": VERSION,
                                "updated": d.get("updated"), "error": d.get("error"),
                                "user": get_user() if logged_in() else ""})
                elif path in ("/", "/index.html", "/login"):
                    self._html(get_html().replace("__VER__", VERSION))
                else:
                    self.send_response(404)
                    self.end_headers()

            def do_POST(self):
                path = urllib.parse.urlsplit(self.path).path
                if path == "/api/sync":
                    d = refresh_once()
                    if d is None:
                        self._json({"logged_in": False, "error": "Zaloguj się najpierw"})
                    else:
                        self._json({"logged_in": True, "updated": d.get("updated"), "error": d.get("error")})
                    return
                if path != "/login":
                    self.send_response(404)
                    self.end_headers()
                    return
                try:
                    length = int(self.headers.get("Content-Length", 0))
                    qs = urllib.parse.parse_qs(self.rfile.read(length).decode("utf-8", "replace"))
                    email = (qs.get("email") or [""])[0].strip()
                    password = (qs.get("password") or [""])[0]
                    mfa = (qs.get("mfa") or [""])[0].strip()
                    force = urllib.parse.parse_qs(urllib.parse.urlsplit(self.path).query).get("force", ["0"])[0] == "1"
                    if not email or not password:
                        self._redirect("/?err=Podaj email i hasło")
                        return
                    do_login(email, password, mfa, force=force)
                    self._redirect("/")
                except Exception as e:
                    self._redirect("/?err=" + urllib.parse.quote(str(e)[:120]))

            def log_message(self, *a):
                pass


        def main():
            os.makedirs(DATA_DIR, exist_ok=True)
            threading.Thread(target=refresh_loop, daemon=True).start()
            HTTPServer(("0.0.0.0", PORT), H).serve_forever()


        if __name__ == "__main__":
            main()

        PYEOF
        exec python3 /data/garmin_server.py
