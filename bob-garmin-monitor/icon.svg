<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d28"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
  </defs>
  <!-- tło: zaokrąglony kwadrat, styl Garmin Connect -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="24" fill="url(#bg)" stroke="#2a3240" stroke-width="2"/>
  <circle cx="50" cy="53" r="31" fill="#0077c8" opacity="0.16"/>

  <!-- tylne koło -->
  <circle cx="32" cy="63" r="15.5" fill="none" stroke="#0077c8" stroke-width="4"/>
  <line x1="32" y1="47.5" x2="32" y2="78.5" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="16.5" y1="63" x2="47.5" y2="63" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="21" y1="52" x2="43" y2="74" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="43" y1="52" x2="21" y2="74" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <circle cx="32" cy="63" r="3" fill="#00a3e0"/>

  <!-- przednie koło -->
  <circle cx="69" cy="63" r="15.5" fill="none" stroke="#0077c8" stroke-width="4"/>
  <line x1="69" y1="47.5" x2="69" y2="78.5" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="53.5" y1="63" x2="84.5" y2="63" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="58" y1="52" x2="80" y2="74" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <line x1="80" y1="52" x2="58" y2="74" stroke="#e8eaed" stroke-width="1.8" opacity="0.35"/>
  <circle cx="69" cy="63" r="3" fill="#00a3e0"/>

  <!-- rama (jasny błękit Garmin) -->
  <g stroke="#00a3e0" stroke-width="4.2" stroke-linecap="round" fill="none">
    <line x1="32" y1="63" x2="45" y2="41"/>  <!-- seat stay -->
    <line x1="32" y1="63" x2="52" y2="59"/>  <!-- chain stay -->
    <line x1="45" y1="41" x2="52" y2="59"/>  <!-- seat tube -->
    <line x1="45" y1="41" x2="62" y2="43"/>  <!-- top tube -->
    <line x1="52" y1="59" x2="62" y2="43"/>  <!-- down tube -->
    <line x1="62" y1="43" x2="69" y2="63"/>  <!-- fork -->
  </g>

  <!-- siodełko + sztyca -->
  <line x1="45" y1="41" x2="45" y2="37" stroke="#00a3e0" stroke-width="3" stroke-linecap="round"/>
  <rect x="38.5" y="33.5" width="14" height="4.2" rx="2.1" fill="#e8eaed"/>

  <!-- kierownica -->
  <line x1="62" y1="43" x2="66" y2="37" stroke="#e8eaed" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="61" y1="33" x2="72" y2="33" stroke="#e8eaed" stroke-width="3.4" stroke-linecap="round"/>

  <!-- pedały -->
  <circle cx="52" cy="59" r="3.4" fill="#e8eaed"/>
  <line x1="52" y1="59" x2="52" y2="65" stroke="#e8eaed" stroke-width="3" stroke-linecap="round"/>
  <rect x="47.5" y="64" width="9" height="3" rx="1.5" fill="#e8eaed"/>
</svg>
